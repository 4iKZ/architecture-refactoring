name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validator dependencies
        run: python -m pip install PyYAML

      - name: Repository-specific validation
        run: python evals/validate_skill.py .

      - name: Fixture tests - shop-cycle
        working-directory: evals/fixtures/shop-cycle
        run: python -m unittest discover -s tests

      - name: Fixture tests - inventory-shared-state
        working-directory: evals/fixtures/inventory-shared-state
        run: python -m unittest discover -s tests

  spec:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install skills-ref reference validator
        run: python -m pip install "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref"

      - name: Official Agent Skills validation (reference tool, non-blocking)
        run: skills-ref validate "$PWD"
